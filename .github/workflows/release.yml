name: Build & Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Place protoc for with-protoc.sh
        shell: bash
        run: |
          mkdir -p src-tauri/.tools/protoc/bin
          PROTOC_PATH="$(command -v protoc)"
          PROTOC_DIR="$(dirname "$(dirname "$PROTOC_PATH")")"
          cp "$PROTOC_PATH" src-tauri/.tools/protoc/bin/protoc
          chmod +x src-tauri/.tools/protoc/bin/protoc
          if [ -d "$PROTOC_DIR/include" ]; then
            mkdir -p src-tauri/.tools/protoc/include
            cp -r "$PROTOC_DIR/include/." src-tauri/.tools/protoc/include/
          fi
          echo "PROTOC_INCLUDE=$(pwd)/src-tauri/.tools/protoc/include" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm install

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Faqih AI ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false