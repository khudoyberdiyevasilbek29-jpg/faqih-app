# Build Faqih AI installers for Windows and macOS (artifacts only — no GitHub Release).
#
# How to trigger (manual):
#   1. Open the repo on GitHub → Actions
#   2. Select "Build installers (Windows + macOS)"
#   3. Click "Run workflow" → choose branch → Run
#
# How to download results:
#   Open the completed run → Artifacts section → download
#   `windows-…` (.exe / .msi) and `macos-…` (.dmg) zip archives.
#
# Also runs on push to branch `release` or tags matching `v*` (e.g. v0.1.0).
#
# Bundled resources (tokenizer, ONNX, lexuz.db) are gitignored locally.
# Set repository secret FAQIH_BUNDLE_RESOURCES_URL to a .tar.gz of:
#   models/tokenizer.json
#   models/multilingual-e5-small.onnx
#   lexuz.db/   (LanceDB directory)
# Pack with:  bash scripts/ci/pack-bundled-resources.sh
# GGUF is NEVER bundled — first-run download inside the app
# (matches tauri.conf.json bundle.resources — no *.gguf entries).

name: Build installers (Windows + macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - release
    tags:
      - "v*"

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: macos-latest
            args: "--bundles dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: "v3-protoc-macos-fix"

      - name: Install protoc (LanceDB build)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LLVM (Windows — llama-cpp-2 bindgen)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare bundled resources (no GGUF)
        shell: bash
        env:
          FAQIH_BUNDLE_RESOURCES_URL: ${{ secrets.FAQIH_BUNDLE_RESOURCES_URL }}
        run: bash scripts/ci/prepare-bundled-resources.sh

      - name: Stage portable protoc for with-protoc.sh
        shell: bash
        run: |
          PROTOC_BIN="$(command -v protoc)"
          if [ -z "$PROTOC_BIN" ]; then
            echo "protoc not found on PATH after setup-protoc step" >&2
            exit 1
          fi
          PROTOC_ROOT="$(cd "$(dirname "$PROTOC_BIN")/.." && pwd)"
          echo "Detected protoc install root: $PROTOC_ROOT"
          ls "$PROTOC_ROOT"
          mkdir -p src-tauri/.tools/protoc
          cp -r "$PROTOC_ROOT"/. src-tauri/.tools/protoc/
          chmod +x src-tauri/.tools/protoc/bin/protoc*
          if [ ! -d src-tauri/.tools/protoc/include/google/protobuf ]; then
            echo "warning: include/google/protobuf not found after copy — well-known types may be missing" >&2
          fi
          ABS_INCLUDE="$(cd src-tauri/.tools/protoc/include && pwd)"
          echo "PROTOC_INCLUDE=$ABS_INCLUDE" >> "$GITHUB_ENV"
          echo "Set PROTOC_INCLUDE=$ABS_INCLUDE"

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[platform]-[arch]-[bundle]"
          args: ${{ matrix.args }}
